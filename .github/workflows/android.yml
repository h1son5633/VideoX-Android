
name: Android APK Build

on:
  push:
    branches:
      - main
    # 防刷发布：只有当提交包含工作流文件本身时才构建发版；
    # 每次发版都最后上传工作流文件，所以中间分批提交不会再逐个触发
    paths:
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/videox-release.p12

      - name: Build APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/videox-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoX-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VideoX v1.2.1（Build #${{ github.run_number }}）
          body: |
            VideoX Android v1.2.2：解析页瘦身与改名善后，打开 App 即可收到更新提示，直接在应用内下载安装。
            - 主页按钮瘦身：只留“粘贴”和“开始解析”并排一行，移除“读取 TXT”和“选择本地视频”（含相关代码）
            - 仓库迁移到新用户名 h1son5633：应用内更新检查与“关于”页仓库链接已同步换成新地址
            构建编号：${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          prerelease: false
          make_latest: true