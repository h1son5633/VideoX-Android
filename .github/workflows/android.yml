
name: Android APK Build

on:
  push:
    branches:
      - main
    # 防刷发布：只有当提交包含工作流文件本身时才构建发版；
    # 每次发版都最后上传工作流文件，所以中间分批提交不会再逐个触发
    paths:
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/videox-release.p12

      - name: Build APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/videox-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoX-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VideoX v1.2.3（Build #${{ github.run_number }}）
          body: |
            VideoX Android v1.2.3：动图在 OPPO/一加相册里能动了，解析接口可以切换，打开 App 即可收到更新提示，直接在应用内下载安装。
            - 动图修复：保存动图时补齐 OPPO/一加的动态照片标记（照一加 13T 原厂样本复刻），ColorOS 相册可识别并播放；谷歌相册等照常
            - 解析接口可切换：设置里新增“解析接口”，接口一（推荐）/接口二/接口三任选，某个接口失效或变慢时换一个；接口三仅支持抖音（B站链接会自动用接口一）
            - 检查更新更诚实：检查失败时明确提示“检查失败，请检查网络后重试”，不再误报“已是最新版本”
            - 底栏外观默认改为“跟随系统”：底板颜色随系统深/浅模式（已手动选过的不受影响）
            构建编号：${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          prerelease: false
          make_latest: true