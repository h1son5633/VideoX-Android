
name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/videox-release.p12

      - name: Build APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/videox-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoX-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VideoX v1.2.1（Build #${{ github.run_number }}）
          body: |
            VideoX Android v1.2.1：小更新合集，打开 App 即可收到更新提示，直接在应用内下载安装。
            - 链接输入框字号调小，分享文案提示一行显示不再折行
            - 解析历史新增平台小标签（抖音 / B站），混存也好认
            - 解析前验链接：粘错链接时输入框下方即时红字提醒
            - 主页副标题改为“媒体下载助手”
            - 设置新增“储存”二级页：下载位置、文件夹路径、缓存与占用都收进去了
            - 设置新增“关于”二级页：版本、检查更新、免责声明、仓库直达链接
            - 更换全新白底图标：图形居中留白，不再顶格放大
            构建编号：${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          prerelease: false
          make_latest: true